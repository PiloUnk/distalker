<!--
  README banner: the icon plus the wordmark, drawn from the same paths as
  logo.svg so the two cannot drift apart.

  Unlike logo.svg this file carries live <text>, so it renders correctly only
  where the font resolves; banner.png is the render of record. Regenerate it
  after editing:
    python3 -c "import cairosvg; cairosvg.svg2png(url='banner.svg',
      write_to='banner.png', output_width=2560, output_height=680)"
  then downsize to 1280x340.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340"
     width="1280" height="340">
  <rect width="1280" height="340" fill="#151020"/>
  <g transform="translate(204,52) scale(0.52)">
  <g stroke="#8B5CF6" stroke-width="30" stroke-linecap="round">
    <path d="M 74 236 L 146 236"/>
    <path d="M 40 300 L 146 300"/>
    <path d="M 74 364 L 146 364"/>
  </g>
  <g transform="translate(44,0)">
    <g stroke="#8B5CF6" stroke-width="26" stroke-linecap="round" fill="none">
      <path d="M 226 178 L 186 106"/>
      <path d="M 286 178 L 326 106"/>
    </g>
    <circle cx="182" cy="98" r="19" fill="#8B5CF6"/>
    <circle cx="330" cy="98" r="19" fill="#8B5CF6"/>
    <rect x="176" y="396" width="34" height="34" rx="12" fill="#8B5CF6"/>
    <rect x="302" y="396" width="34" height="34" rx="12" fill="#8B5CF6"/>
    <rect x="122" y="180" width="268" height="228" rx="42" fill="#8B5CF6"/>
    <rect x="158" y="216" width="196" height="156" rx="22" fill="#2A1F47"/>
    <path d="M 228 254 L 306 294 L 228 334 Z" fill="#FFFFFF"
          stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>
  </g></g>
  <text x="522" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="104" font-weight="bold">
    <tspan fill="#8B5CF6">Dis</tspan><tspan fill="#FFFFFF">talker</tspan>
  </text>
  <text x="528" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#9B94AE">
    Stalker Portal &#183; MAG Portal &#183; STB Portal
  </text>
  <text x="528" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#8B5CF6">
    a Dispatcharr plugin
  </text>
</svg>
