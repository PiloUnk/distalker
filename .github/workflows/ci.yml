name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # All ship with Dispatcharr already; the plugin adds no dependencies of its own.
      - name: Install dependencies
        run: pip install --quiet requests redis celery

      - name: Byte-compile every module
        run: python3 -m compileall -q .

      - name: Config and protocol tests
        run: python3 tests/test_config.py

      - name: Mock portal integration test
        run: python3 tests/test_mock_portal.py

      - name: Upgrade migration test
        run: python3 tests/test_migration.py

      - name: Settings-panel recovery test
        run: python3 tests/test_registry.py

      - name: Manifest and action plumbing test
        run: python3 tests/test_manifest.py

      - name: Non-portal source fallback test
        run: python3 tests/test_fallback.py

      - name: Auto-assign signal test
        run: python3 tests/test_signals.py

      - name: Redis-loss test
        run: python3 tests/test_state.py

      - name: Build the plugin ZIP
        run: ./build.sh
